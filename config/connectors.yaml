# Connector endpoints (docs/lld/connectors.md §3). URLs live here, never in code.
# `{slug}` is the company's ATS board identifier from config/companies.yaml.
# Every host used here must have an entry in config/source_policies.yaml.
connectors:
  greenhouse:
    list_url: https://boards-api.greenhouse.io/v1/boards/{slug}/jobs
    params: {content: "true"}
  lever:
    list_url: https://api.lever.co/v0/postings/{slug}
    params: {mode: json}
  ashby:
    list_url: https://api.ashbyhq.com/posting-api/job-board/{slug}
    params: {includeCompensation: "true"}
  workable:
    list_url: https://apply.workable.com/api/v1/widget/accounts/{slug}
    params: {details: "true"}
  smartrecruiters:
    list_url: https://api.smartrecruiters.com/v1/companies/{slug}/postings
    params: {}
    page_size: 100
    max_pages: 10
    posting_url: https://jobs.smartrecruiters.com/{slug}/{id}

  # --- Aggregators (one run per connector covering all market × role queries) ---
  adzuna:
    list_url: https://api.adzuna.com/v1/api/jobs/{country}/search/{page}
    params: {results_per_page: 50, max_days_old: 3, content-type: application/json}
    max_pages: 2
    # Market pack code → Adzuna country path. Adzuna does not cover the UAE (skipped, logged).
    countries: {india: in}
  remotive:
    list_url: https://remotive.com/api/remote-jobs
    params: {}
    # Role taxonomy field → Remotive category (one request per category per run).
    categories: {software_it: software-dev}
