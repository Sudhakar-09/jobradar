# Source policy registry (ADR-0022). Decides what JobRadar may do on each host.
# - Any host not listed here is one-tap only (JobRadar hands the user a link and does nothing else).
# - Hosts are exact ("api.lever.co") or wildcard ("*.indeed.com" = any subdomain).
# - `server_apply` is granted to an ATS only after a terms review recorded in docs/decisions-log.md.
# - Changing an entry is a reviewed change with a decisions-log entry.
policies:
  # --- Public ATS job boards (read the employer's public postings) ---
  - id: greenhouse
    name: Greenhouse job boards
    hosts: [boards-api.greenhouse.io, boards.greenhouse.io, job-boards.greenhouse.io]
    modes: [ats_feed, extension_assist]
    rate_limit: {per_minute: 30, burst: 5}
    docs_url: https://developers.greenhouse.io/job-board.html
    notes: Public Job Board API, no key needed. server_apply pending terms review.
    last_reviewed: 2026-10-30

  - id: lever
    name: Lever postings
    hosts: [api.lever.co, jobs.lever.co, api.eu.lever.co, jobs.eu.lever.co]
    modes: [ats_feed, extension_assist]
    rate_limit: {per_minute: 30, burst: 5}
    docs_url: https://github.com/lever/postings-api
    notes: Public Postings API, no key needed. server_apply pending terms review.
    last_reviewed: 2026-10-30

  - id: ashby
    name: Ashby job boards
    hosts: [api.ashbyhq.com, jobs.ashbyhq.com]
    modes: [ats_feed, extension_assist]
    rate_limit: {per_minute: 30, burst: 5}
    docs_url: https://developers.ashbyhq.com/
    notes: Public job posting API, no key needed. server_apply pending terms review.
    last_reviewed: 2026-10-30

  - id: workable
    name: Workable job boards
    hosts: [apply.workable.com]
    modes: [ats_feed, extension_assist]
    # Lowered from 20/min on 2026-10-31: Workable answered most probe requests at 20/min with 429.
    rate_limit: {per_minute: 10, burst: 3}
    notes: Public account job widget endpoint, no key needed. server_apply pending terms review.
    last_reviewed: 2026-10-30

  - id: smartrecruiters
    name: SmartRecruiters job boards
    hosts: [api.smartrecruiters.com, jobs.smartrecruiters.com, careers.smartrecruiters.com]
    modes: [ats_feed, extension_assist]
    rate_limit: {per_minute: 30, burst: 5}
    docs_url: https://developers.smartrecruiters.com/
    notes: Public Posting API, no key needed. server_apply pending terms review.
    last_reviewed: 2026-10-30

  - id: workday
    name: Workday-hosted career sites
    hosts: ["*.myworkdayjobs.com"]
    modes: [one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: No public feed; one-tap only.
    last_reviewed: 2026-10-30

  # --- Aggregator APIs ---
  - id: adzuna
    name: Adzuna API
    hosts: [api.adzuna.com]
    modes: [api]
    rate_limit: {per_minute: 10, burst: 2, per_day: 250}
    docs_url: https://developer.adzuna.com/
    notes: >-
      Needs an app id and key (owner's account). Free plan = 25 test calls in total; paid plan
      (£8/month) = 5,000 calls/month, 500/day. Connector disabled in Stage 1
      (config/connectors.yaml). Registered use case "Personal job search": terms review needed
      before Stage 2 (multi-user use).
    last_reviewed: 2026-10-30

  - id: remotive
    name: Remotive remote jobs API
    hosts: [remotive.com]
    modes: [api]
    rate_limit: {per_minute: 1, burst: 1, per_day: 4}
    notes: Remotive asks API users to poll rarely and to link back to the original posting; verify their current API terms before Phase 2 goes live.
    last_reviewed: 2026-10-30

  # --- Platforms that forbid automation: job-alert emails and one-tap links only (CLAUDE.md rule 4) ---
  - id: linkedin
    name: LinkedIn
    hosts: [linkedin.com, "*.linkedin.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    terms_url: https://www.linkedin.com/legal/user-agreement
    notes: No scraping, filling or clicking. The extension uses the side panel only.
    last_reviewed: 2026-10-30

  - id: indeed
    name: Indeed
    hosts: [indeed.com, "*.indeed.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: No scraping, filling or clicking. The extension uses the side panel only.
    last_reviewed: 2026-10-30

  - id: stepstone
    name: StepStone
    hosts: [stepstone.de, "*.stepstone.de"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: Germany job board. Alert emails and one-tap only; no scraping, filling or clicking.
    last_reviewed: 2026-10-31

  - id: xing
    name: XING
    hosts: [xing.com, "*.xing.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: German-speaking professional network. Alert emails and one-tap only; no scraping.
    last_reviewed: 2026-10-31

  - id: naukri
    name: Naukri
    hosts: [naukri.com, "*.naukri.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: One-tap until a terms review in Phase 8 decides on extension assist.
    last_reviewed: 2026-10-30

  - id: instahyre
    name: Instahyre
    hosts: [instahyre.com, "*.instahyre.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: India channel through job-alert emails and one-tap links only (owner decision, 2f).
    last_reviewed: 2026-10-30

  - id: foundit
    name: Foundit (formerly Monster India)
    hosts: [foundit.in, "*.foundit.in"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: India channel through job-alert emails and one-tap links only (owner decision, 2f).
    last_reviewed: 2026-10-30

  - id: naukrigulf
    name: Naukrigulf
    hosts: [naukrigulf.com, "*.naukrigulf.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: UAE channel through job-alert emails and one-tap links only (owner decision).
    last_reviewed: 2026-10-30

  - id: bayt
    name: Bayt
    hosts: [bayt.com, "*.bayt.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: UAE channel through job-alert emails and one-tap links only.
    last_reviewed: 2026-10-30

  - id: gulftalent
    name: GulfTalent
    hosts: [gulftalent.com, "*.gulftalent.com"]
    modes: [alert_email, one_tap]
    rate_limit: {per_minute: 1, burst: 1}
    notes: UAE channel through job-alert emails and one-tap links only.
    last_reviewed: 2026-10-30

  # --- Infrastructure APIs JobRadar calls on the user's behalf ---
  - id: gmail_api
    name: Gmail API (read-only)
    hosts: [gmail.googleapis.com, oauth2.googleapis.com]
    modes: [api]
    rate_limit: {per_minute: 60, burst: 10}
    notes: gmail.readonly scope, query limited to configured alert senders (ADR-0008).
    last_reviewed: 2026-10-30

  # --- Company websites: logo proxy only (ADR-0022 amendment) ---
  - id: company_websites
    name: Catalogued companies' own websites
    company_domains: true
    modes: [logo_fetch]
    rate_limit: {per_minute: 6, burst: 2}
    notes: Icon files only, at most once per company every 30 days, SSRF-guarded.
    last_reviewed: 2026-10-30
