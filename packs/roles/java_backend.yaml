code: java_backend
field: software_it
family: software_engineering
isco_08: "2512"  # Software developers
title_aliases:
  - Java Backend Engineer
  - Java Backend Developer
  - Backend Software Engineer (Java)
  - Java Software Engineer
title_aliases_by_locale: {}
# Generic titles: count only when the description shows Java backend work (owner decision
# 2026-10-31; "requires description match"; applied by Phase 3 matching).
conditional_title_aliases:
  - &java_backend_work
    title: Software Engineer
    requires_description: {all_of: [java], any_of: [spring, spring boot, jvm, hibernate, quarkus, micronaut]}
  - {<<: *java_backend_work, title: Backend Engineer}
  - {<<: *java_backend_work, title: Software Developer}
  - {<<: *java_backend_work, title: SDE}
  - {<<: *java_backend_work, title: Software Development Engineer}
# Seniority from title words (owner decision 2026-10-31). For a `mid` profile: mid = target,
# senior (incl. lead) = eligible stretch with a score penalty, staff and executive = ineligible.
# Titles without a seniority word count as mid. Years: a posting's minimum years of experience
# maps to the level whose range contains it: up to "4+ years" mid (target), "5+"/"6+" senior
# (stretch), "7+" staff (ineligible); set for the owner's 3.3 years (owner decision 2026-10-31).
seniority_signals:
  default_level: mid
  levels:
    junior: {title_words: [junior, jr, graduate, entry level, trainee, intern], years: [0, 2]}
    mid: {title_words: [ii, "2", mid, mid level, intermediate], years: [2, 5]}
    senior: {title_words: [senior, sr, lead, iii], years: [5, 7]}
    staff: {title_words: [staff, principal, architect, distinguished], years: [7, 15]}
    executive: {title_words: [director, head of, vp, vice president, cto], years: [10, 40]}
core_skills:
  - Java
  - Backend software development
  - REST API design and implementation
  - Automated testing
  - Relational databases and SQL
  - Build and dependency management
adjacent_roles:
  - Backend Engineer
  - Platform Engineer
  - Full Stack Engineer
signal_documents:
  - GitHub or code portfolio, if available
required_credentials: []
valued_credentials: []
hiring_patterns:
  channels: [company_ats, referral, recruiter, alert_email]
  stages:
    - Recruiter screen
    - Coding assessment
    - Technical interview
    - System design interview
    - Hiring manager interview
  assessment_types:
    - Java coding exercise
    - Backend technical interview
    - API and system design interview
  seasonality: null
  typical_weeks_to_hire: null
resume_emphasis:
  - Delivered backend systems and measurable outcomes
  - Java services, APIs, and relevant frameworks actually used
  - Testing, data stores, reliability, and collaboration
# This pack uses the ESCO classification of the European Commission (reuse under Commission
# Decision 2011/833/EU); labels such as "Java Backend Engineer" are our own, not ESCO labels.
# ISCO-08: code and short title only (ILO).
provenance:
  last_verified: 2026-10-31  # per-value record: packs/verification/java_backend.yaml
  references:
    - title: ESCO occupation 'software developer' (ISCO-08 2512)
      url: http://data.europa.eu/esco/occupation/f2b15a0e-e65a-438a-affb-29b9d50b77d1
    - title: ISCO-08 unit group 2512 Software developers (via ESCO)
      url: http://data.europa.eu/esco/isco/C2512
    - title: Amazon SDE II interview prep
      url: https://amazon.jobs/content/en/how-we-hire/sde-ii-interview-prep
