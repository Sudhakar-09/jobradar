code: india
name: India
kind: country
country_codes: [IN]

money:
  currency: INR
  quoted_periods: [year, month]
  default_period: year
  quoted_bases: [ctc, gross]
  default_basis: ctc
  common_allowances: []
  income_tax: progressive
  compensation_model: india_ctc
  notes: >-
    Usually quoted as annual CTC with fixed and variable parts; distinguish fixed pay from CTC
    when stated. CTC includes employer PF and gratuity, and variable pay is paid only when earned.
    In-hand pay deducts employee PF (12% of basic + DA; often capped at the Rs 15,000/month wage
    ceiling, i.e. Rs 1,800/month; since the Labour Codes of 21 Nov 2025 allowances above 50% of
    pay count as wages for PF), state professional tax (at most Rs 2,500 a year, e.g.
    Maharashtra Rs 200/month and Rs 300 in February; rates differ by state) and progressive
    income tax. The new regime is the default (s.115BAC of the Income-tax Act 1961 through
    FY 2025-26; s.202 of the Income-tax Act 2025 from tax year 2026-27); the old regime is
    opt-in each year for salary income.

locales:
  - {code: en-IN, rtl: false}
default_locale: en-IN

cv:
  format: in
  term: resume
  length_pages: [1, 2]
  photo_customary: false  # IT/private sector; photo and biodata still common in government, PSU, BFSI
  fields_default_on: [current_location, notice_period]
  fields_default_off:
    [nationality, visa_status, current_ctc, expected_ctc, photo, date_of_birth, marital_status]
  section_order: [summary, skills, experience, projects, education, certifications]

visa_routes: []
sponsor_register_source: null
nationality_restricted_programmes: []

sources:
  - code: company_ats
    name: Company career pages and ATS boards
    kind: ats
    access_modes: [ats_feed, extension_assist]
  - code: adzuna  # disabled in Stage 1 (paid plan needed); see docs/decisions-log.md
    name: Adzuna
    kind: aggregator
    hosts: [api.adzuna.com]
    access_modes: [api]
  - code: instahyre
    name: Instahyre
    kind: job_board
    hosts: [instahyre.com, "*.instahyre.com"]
    access_modes: [alert_email, one_tap]
  - code: foundit
    name: Foundit
    kind: job_board
    hosts: [foundit.in, "*.foundit.in"]
    access_modes: [alert_email, one_tap]
  - code: naukri
    name: Naukri
    kind: job_board
    hosts: [naukri.com, "*.naukri.com"]
    access_modes: [alert_email, one_tap]
  - code: linkedin
    name: LinkedIn
    kind: professional_network
    hosts: [linkedin.com, "*.linkedin.com"]
    access_modes: [alert_email, one_tap]
  - code: indeed
    name: Indeed
    kind: job_board
    hosts: [indeed.com, "*.indeed.com"]
    access_modes: [alert_email, one_tap]

notice_period_norm: >-
  Set by contract, with no statutory norm. 30 to 90 days is common: about one in three IT roles
  (large IT services firms) has 90 days, product companies and start-ups often 30 to 60.
  "Immediate joiner" and notice "buyout" are common terms. Use the candidate's stated notice
  period.
hiring_seasons: []
language_notes: Use language requirements from each individual job posting.
credential_recognition: []

provenance:
  last_verified: 2026-10-31  # per-value record: packs/verification/india.yaml
  references:
