      url: https://www.incometax.gov.in/iec/foportal/help/new-tax-vs-old-tax-regime-faqs
    - title: Salaried individuals for AY 2026-27 (Income Tax Department)
      url: https://www.incometax.gov.in/iec/foportal/help/individual/return-applicable-1
    - title: Finance Bill 2026 (Income Tax Department)
      url: https://www.incometax.gov.in/iec/foportal/sites/default/files/2026-03/Finance_Bill.pdf
    - title: EPF Scheme (EPFO)
      url: https://pmvbry.epfindia.gov.in/epf-scheme/
    - title: Maharashtra Profession Tax rate schedule
      url: https://www.mahagst.gov.in/public/uploads/menufiles/PT%20Rate%20Schedule%20updated%20upto%2031.03.2025%20(1)%20(1).pdf
