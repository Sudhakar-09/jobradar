- field: money.income_tax
  claim: Progressive income tax
  status: verified
  source_title: Salaried individuals for AY 2026-27 (incometax.gov.in)
  source_url: https://www.incometax.gov.in/iec/foportal/help/individual/return-applicable-1
  checked_on: '2026-10-31'
  notes: 'New regime FY 2025-26: nil to 4L; 5/10/15/20/25/30%; 87A rebate up to Rs 60,000 when taxable
    income <= 12L. Cess 4% and surcharge on top.'
- field: money.notes (regime, FY 2025-26)
  claim: New regime by default, old regime optional
  status: verified
  source_title: New vs old tax regime FAQs (incometax.gov.in)
  source_url: https://www.incometax.gov.in/iec/foportal/help/new-tax-vs-old-tax-regime-faqs
  checked_on: '2026-10-31'
  notes: s.115BAC default from AY 2024-25; salaried employees choose yearly; opt-out in the ITR.
- field: money.notes (regime, tax year 2026-27)
  claim: Default new regime continues under the Income-tax Act 2025 (s.202)
  status: verified
  source_title: Finance Bill 2026 (incometax.gov.in)
  source_url: https://www.incometax.gov.in/iec/foportal/sites/default/files/2026-03/Finance_Bill.pdf
  checked_on: '2026-10-31'
  notes: Act in force 1 Apr 2026; s.202 is the default regime; slabs unchanged per secondary sources.
    s.202(4) opt-out wording not fetched (403).
- field: money.notes (employee PF)
  claim: Employee PF 12% of basic + DA; Rs 15,000/month wage ceiling
  status: verified
  source_title: EPF Scheme (EPFO)
  source_url: https://pmvbry.epfindia.gov.in/epf-scheme/
  checked_on: '2026-10-31'
  notes: Employer may cap at Rs 15,000 (Rs 1,800/month) or contribute on full basic.
- field: money.notes (Labour Codes wage rule)
  claim: Allowances above 50% of pay count as wages for PF (from 21 Nov 2025)
  status: verified
  source_title: Compliance handbook under the four Labour Codes (Ministry of Labour)
  source_url: https://www.labour.gov.in/static/uploads/2026/02/83978455025732b99b0165def80ab171.pdf
  checked_on: '2026-10-31'
  notes: Seen via official search excerpts; the PDF was not fetched in full.
- field: money.notes (professional tax)
  claim: State-level professional tax, capped at Rs 2,500 a year
  status: verified
  source_title: Maharashtra Profession Tax rate schedule (mahagst.gov.in)
  source_url: https://www.mahagst.gov.in/public/uploads/menufiles/PT%20Rate%20Schedule%20updated%20upto%2031.03.2025%20(1)%20(1).pdf
  checked_on: '2026-10-31'
  notes: Art. 276 cap Rs 2,500; Maharashtra Rs 200/month and Rs 300 in February above Rs 10,000/month.
- field: money.notes (states without PT)
  claim: Some states and UTs levy no professional tax (e.g. Delhi, Haryana, UP)
  status: unverified
  source_title: null
