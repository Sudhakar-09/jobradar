- field: money.default_period, money.quoted_periods
  claim: Salaries usually quoted monthly (also yearly)
  status: secondary
  source_title: Payment of salaries/wages (u.ae)
  source_url: https://u.ae/en/information-and-services/jobs/Sector-of-employment/employment-in-the-private-sector/payment-of-wages
  checked_on: '2026-10-31'
  notes: Officially wages are paid monthly; quoting monthly in job ads is market convention.
- field: money.quoted_bases, money.default_basis
  claim: Package = basic + allowances; basic vs package matters
  status: verified
  source_title: MoHRE FAQ (Federal Decree-Law No. 33 of 2021)
  source_url: https://www.mohre.gov.ae/en/laws-and-regulations/Laws/faq.aspx
  checked_on: '2026-10-31'
  notes: Basic wage excludes allowances; end-of-service gratuity is computed on the last basic wage (via
    search excerpts; mohre.gov.ae refused direct connections).
- field: money.common_allowances (housing, transport)
  claim: Housing and transport allowances are common
  status: secondary
