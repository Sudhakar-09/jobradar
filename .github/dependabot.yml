# Dependency updates (owner decision, Step 5 review). Dependabot keeps SHA-pinned actions pinned
# and updates the version comment. Every update PR must pass CI like any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kolkata
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
      runtime-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
