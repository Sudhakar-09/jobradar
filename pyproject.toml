[project]
name = "jobradar"
version = "0.1.0"
description = "A personal job search operating system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "fastapi[standard]>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "structlog>=24.4",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "jobradar"
module-root = "src"

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "jobradar.core.*"
strict = true

[[tool.mypy.overrides]]
module = ["celery", "kombu", "yaml"]
ignore_missing_imports = true