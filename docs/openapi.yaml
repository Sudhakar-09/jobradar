# JobRadar API v1 contract. Hand-maintained (owner decision, Step 4 review): change it only in a PR that states the reason; models are mirrored in docs/lld/*.md.
openapi: 3.1.0
info:
  title: JobRadar API
  version: 0.1.0
  description: 'Contract for all v1 operations. Human-readable rules (auth, errors, pagination, idempotency, rate limits)
    are in docs/api.md. Vendor extensions: x-phase (first phase that ships the operation), x-story (PRD stories), x-scopes
    (client-token scopes), x-roles, x-idempotency, x-support-grant, x-untrusted.'
servers:
- url: /api/v1
tags:
- name: health
  description: Liveness and readiness probes (unversioned).
- name: accounts
  description: Sign-in, sessions, MFA, client tokens and support grants.
- name: controls
  description: Pause/resume, user flags, status, usage and plans.
- name: packs
  description: Read-only market/role/persona packs and legal documents.
- name: profile
  description: Profile, resume drafts, CV variants, answer bank and onboarding.
- name: inboxes
  description: Consents, alert inboxes and company suggestions.
- name: matching
  description: Matches, job detail, explanations, scoring and job actions.
- name: applications
  description: Applications pipeline, questions, attempts and documents.
- name: lifecycle
  description: Email linking, contacts, interviews and offers.
- name: notify
  description: Digest, notifications, preferences and channels.
- name: insights
  description: Search plan, proposals, insights and product events.
- name: privacy
  description: Export and account deletion.
- name: extension
  description: Browser extension endpoints.
- name: runner
  description: Optional home runner endpoints.
- name: admin
  description: Admin console (operational data only).
paths:
  /health:
    servers:
    - url: /
      description: Unversioned probe endpoints
    get:
      operationId: core_get_health
      summary: Process alive
      tags:
      - health
      x-phase: 0
      x-story:
      - US-0.1
      x-scopes: []
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '500':
          $ref: '#/components/responses/InternalError'
  /ready:
    servers:
    - url: /
      description: Unversioned probe endpoints
    get:
      operationId: core_get_readiness
      summary: DB, Redis, queue reachable
      tags:
      - health
      x-phase: 0
      x-story:
      - US-0.1
      x-scopes: []
      security:
      - {}
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Success.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/X-Correlation-ID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/signup:
    post:
      operationId: accounts_create_signup
      summary: Create account (mode closed/invite/open; invite code when invite)
      tags:
      - accounts
      x-phase: 10
      x-story:
      - US-10.1
      x-scopes: []
      security:
