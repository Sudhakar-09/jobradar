      parameters:
      - $ref: '#/components/parameters/ClientVersion'
      - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Success.
          headers:
            X-Correlation-ID:
