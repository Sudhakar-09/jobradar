components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: jr_session
      description: Server-side web session (HttpOnly, Secure, SameSite=Lax). Admin/owner sessions must be MFA-verified for
        admin operations.
    csrf:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit token equal to the `jr_csrf` cookie; required with `session` on every state-changing request.
    extensionToken:
      type: http
      scheme: bearer
      bearerFormat: jr_extension_*
      description: Scoped, host-limited, rotating token from extension pairing.
    telegramToken:
      type: http
      scheme: bearer
      bearerFormat: jr_telegram_*
      description: Per-user token issued at Telegram linking; held encrypted by the bot.
    runnerToken:
      type: http
      scheme: bearer
      bearerFormat: jr_runner_*
    adminApiToken:
      type: http
      scheme: bearer
      bearerFormat: jr_admin_api_*
    botServiceToken:
      type: http
      scheme: bearer
      bearerFormat: jr_bot_*
      description: Bot service credential; only valid for exchanging a Telegram link code.
    actionToken:
      type: apiKey
      in: header
      name: X-Action-Token
      description: Signed, single-purpose action token from a notification button (72 h, single use where not idempotent).
        Sent as a header so it never lands in server or proxy logs; `/actions` also accepts it in the JSON body for email
        links opened via the web app.
    webhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC signature from the inbound mail provider.
  parameters:
    ClientVersion:
      name: X-Client-Version
      in: header
      required: true
      schema:
        type: string
        pattern: ^[a-z_]+@\d+\.\d+\.\d+
      description: '`<app>@<semver>`; below the minimum the API returns 426.'
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: First response stored 24 h per (user, key, route) and replayed.
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: ETag from the last GET; mismatch returns 412.
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor from `next_cursor`.
  headers:
    X-Correlation-ID:
      schema:
        type: string
        format: uuid
    ETag:
      schema:
        type: string
    RateLimit-Limit:
      schema:
        type: integer
    RateLimit-Remaining:
      schema:
        type: integer
    RateLimit-Reset:
      schema:
        type: integer
      description: Seconds until the window resets.
    Retry-After:
      schema:
        type: integer
  responses:
    BadRequest:
      description: Malformed request or unknown parameter (`bad_request`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Missing or expired credentials (`unauthenticated`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Missing scope or role, CSRF failure or MFA required (`forbidden`, `csrf_failed`, `mfa_required`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Not found, including resources owned by another user (`not_found`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflict (`conflict`, `invalid_transition`, `concurrency_conflict`, `guard_failed`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionFailed:
      description: ETag mismatch (`precondition_failed`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Validation failed (`validation_failed`); see `errors[]`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ClientOutdated:
      description: Client version below minimum (`client_outdated`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ConsentRequired:
      description: Consent for the source is required first (`consent_required`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit, quota or LLM budget exceeded (`rate_limited`, `quota_exceeded`, `budget_exceeded`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpstreamError:
      description: External service failed (`upstream_error`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Temporarily unavailable (`upstream_unavailable`, `paused`).
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/X-Correlation-ID'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
